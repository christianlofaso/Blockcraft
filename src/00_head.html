<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Blockcraft — a Minecraft clone in one HTML file</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000;
    font-family:"Lucida Console",Monaco,monospace; color:#fff; user-select:none; -webkit-user-select:none; }
  canvas { display:block; width:100%; height:100%; image-rendering:pixelated; }
  /* Own compositor layer: the HUD updates every time you switch slots, and
     without this the overlay repaint drags the WebGL canvas into the same
     recomposite. (Safe here — #drag/#tooltip/.screen are siblings, so this
     transform never becomes their containing block.) */
  #hud { position:absolute; inset:0; pointer-events:none;
    transform:translateZ(0); will-change:transform; }

  /* ---------- crosshair ---------- */
  #crosshair { position:absolute; left:50%; top:50%; width:22px; height:22px; margin:-11px 0 0 -11px;
    mix-blend-mode:difference; opacity:.85; }
  #crosshair::before,#crosshair::after { content:""; position:absolute; background:#fff; }
  #crosshair::before { left:9px; top:0; width:4px; height:22px; }
  #crosshair::after  { top:9px; left:0; height:4px; width:22px; }

  /* ---------- hotbar ---------- */
  #hotbar { position:absolute; left:50%; bottom:8px; transform:translateX(-50%);
    display:flex; padding:3px; background:rgba(20,20,20,.62); border:3px solid #1c1c1c;
    border-radius:3px; box-shadow:0 0 0 3px rgba(255,255,255,.06) inset; }
  .slot { position:relative; width:52px; height:52px; margin:1px; background:rgba(139,139,139,.35);
    border:2px solid rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .slot.sel { outline:4px solid #fff; outline-offset:-1px; background:rgba(200,200,200,.45); z-index:2; }
  .slot canvas { width:40px; height:40px; }
  .slot .cnt { position:absolute; right:2px; bottom:-1px; font-size:15px; font-weight:bold;
    text-shadow:2px 2px 0 #3f3f3f; pointer-events:none; }
  .slot .dur { position:absolute; left:3px; right:3px; bottom:3px; height:4px; background:#000; }
  .slot .dur i { display:block; height:100%; background:#0f0; }

  /* ---------- status bars ----------
     Everything in the bottom stack is the width of the hotbar (9 slots of 54px
     + 6px padding + 6px border = 498px) so the rows line up with it. Hearts and
     hunger are 10 x 19px = 190px each, which fits side by side with a gap. */
  :root { --hud-w: 498px; }
  #stats { position:absolute; left:50%; bottom:96px; transform:translateX(-50%);
    width:var(--hud-w); height:40px; }
  #hearts { position:absolute; left:0; bottom:0; display:flex; }
  #food { position:absolute; right:0; bottom:0; display:flex; flex-direction:row-reverse; }
  #armorbar { position:absolute; left:0; bottom:20px; display:flex; }
  #air { position:absolute; right:0; bottom:20px; display:flex; flex-direction:row-reverse; }
  .icon { width:18px; height:18px; margin:0 .5px; background-repeat:no-repeat; background-size:contain; }
  #xpbar { position:absolute; left:50%; bottom:78px; transform:translateX(-50%);
    width:var(--hud-w); height:14px; background:#1a1a1a; border:2px solid #000; }
  #xpbar i { display:block; height:100%; width:0%; background:linear-gradient(#8aff3f,#4fbf00); }
  #xplevel { position:absolute; left:50%; bottom:76px; transform:translateX(-50%);
    color:#7cfc00; font-size:17px; font-weight:bold; text-shadow:2px 2px 0 #000,-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000; }

  /* ---------- misc hud ---------- */
  #itemname { position:absolute; left:50%; bottom:144px; transform:translateX(-50%);
    font-size:16px; text-shadow:2px 2px 0 #3f3f3f; opacity:0; transition:opacity .4s; white-space:nowrap; }
  #debug { position:absolute; left:6px; top:6px; font-size:12px; line-height:1.45;
    text-shadow:1px 1px 0 #000; display:none; white-space:pre; background:rgba(0,0,0,.35); padding:4px 6px; }
  #toast { position:absolute; left:50%; top:14%; transform:translateX(-50%); text-align:center;
    font-size:15px; text-shadow:2px 2px 0 #000; opacity:0; transition:opacity .5s; }
  #chatlog { position:absolute; left:8px; bottom:176px; font-size:13px; line-height:1.6; max-width:60%; }
  #chatlog div { background:rgba(0,0,0,.42); padding:1px 5px; margin-top:2px; width:fit-content; text-shadow:1px 1px 0 #000; }
  #chatbar { position:absolute; left:0; right:0; bottom:0; display:none; pointer-events:auto; }
  #chatbar input { width:100%; padding:6px 8px; background:rgba(0,0,0,.62); border:none; outline:none;
    color:#fff; font-family:inherit; font-size:15px; }
  #vig { position:absolute; inset:0; box-shadow:inset 0 0 140px 40px rgba(0,0,0,.55); }
  #hurt { position:absolute; inset:0; background:radial-gradient(circle,rgba(255,0,0,0) 30%,rgba(190,0,0,.65) 100%);
    opacity:0; transition:opacity .25s; }
  #overlaytex { position:absolute; inset:0; opacity:0; }

  /* ---------- screens ---------- */
  .screen { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(0,0,0,.72); pointer-events:auto; z-index:20; }
  .screen.on { display:flex; }
  .panel { background:#c6c6c6; border:4px solid #fff; border-right-color:#555; border-bottom-color:#555;
    padding:16px; color:#3f3f3f; box-shadow:0 0 0 4px #000, 0 12px 40px rgba(0,0,0,.6); }
  .panel h2 { font-size:15px; margin-bottom:10px; color:#3f3f3f; letter-spacing:.5px; }
  .btn { display:block; width:100%; padding:9px 14px; margin:6px 0; font-family:inherit; font-size:14px;
    color:#fff; background:#8b8b8b; border:3px solid #fff; border-right-color:#373737; border-bottom-color:#373737;
    text-shadow:2px 2px 0 #383838; cursor:pointer; }
  .btn:hover { background:#a0a8a0; }
  .btn:active { border-color:#373737; border-right-color:#fff; border-bottom-color:#fff; }
  .row { display:flex; gap:8px; }
  .row .btn { margin:6px 0; }

  #title .panel { width:min(560px,92vw); text-align:center; }
  #titlelogo { font-size:min(56px,9vw); letter-spacing:4px; color:#fff; text-shadow:4px 4px 0 #2b2b2b;
    margin:4px 0 2px; font-weight:bold; }
  #titlesub { font-size:12px; color:#555; margin-bottom:14px; }
  .field { display:flex; align-items:center; gap:8px; margin:8px 0; font-size:13px; }
  .field label { flex:0 0 120px; text-align:right; }
  .field input,.field select { flex:1; padding:6px; font-family:inherit; font-size:13px;
    background:#000; color:#fff; border:2px solid #555; }
  .help { font-size:11px; line-height:1.7; color:#3f3f3f; text-align:left; margin-top:10px;
    max-height:34vh; overflow:auto; background:#b0b0b0; padding:8px; }
  .help b { color:#1a1a1a; }

  /* ---------- inventory ---------- */
  #inv .panel { padding:14px; }
  .invgrid { display:grid; gap:2px; }
  .islot { width:44px; height:44px; background:#8b8b8b; border:2px solid #373737;
    border-right-color:#fff; border-bottom-color:#fff; position:relative; cursor:pointer; }
  .islot.hi { background:#d6d6d6; }
  .islot canvas { position:absolute; left:3px; top:3px; width:34px; height:34px; }
  .islot .cnt { position:absolute; right:1px; bottom:0; font-size:13px; color:#fff; font-weight:bold;
    text-shadow:1.5px 1.5px 0 #3f3f3f; }
  .islot .dur { position:absolute; left:3px; right:3px; bottom:2px; height:3px; background:#000; }
  .islot .dur i { display:block; height:100%; background:#0f0; }
  #drag { position:fixed; width:44px; height:44px; pointer-events:none; z-index:100; display:none;
    transform:translate(-22px,-22px); }
  #drag canvas { width:36px; height:36px; margin:4px; }
  #drag .cnt { position:absolute; right:2px; bottom:0; font-size:13px; color:#fff; font-weight:bold; text-shadow:1.5px 1.5px 0 #000; }
  .invtitle { font-size:12px; margin:6px 0 4px; color:#3f3f3f; }
  #tooltip { position:fixed; z-index:110; background:rgba(16,0,32,.94); border:2px solid #2d0a63;
    padding:4px 7px; font-size:12px; color:#fff; pointer-events:none; display:none; white-space:nowrap; }
  #tooltip small { color:#a0a0a0; display:block; font-size:11px; }

  /* ---------- mobile ---------- */
  #touch { position:absolute; inset:0; display:none; }
  #touch.on { display:block; }
  .tbtn { position:absolute; pointer-events:auto; background:rgba(255,255,255,.18);
    border:2px solid rgba(255,255,255,.35); border-radius:8px; display:flex; align-items:center;
    justify-content:center; font-size:20px; color:#fff; }
  #stick { position:absolute; left:20px; bottom:110px; width:140px; height:140px; border-radius:50%;
    background:rgba(255,255,255,.12); border:2px solid rgba(255,255,255,.3); pointer-events:auto; }
  #stick i { position:absolute; left:50%; top:50%; width:56px; height:56px; margin:-28px 0 0 -28px;
    border-radius:50%; background:rgba(255,255,255,.35); }
  #loading { position:absolute; inset:0; background:#0b0b12; display:flex; align-items:center;
    justify-content:center; flex-direction:column; gap:14px; z-index:50; }
  #loading .bar { width:min(420px,70vw); height:14px; background:#222; border:2px solid #000; }
  #loading .bar i { display:block; height:100%; width:0%; background:linear-gradient(#8dd35f,#4b8b2b); transition:width .2s; }
  #loading .t { font-size:13px; color:#aaa; }
  .fadein { animation:fi .35s ease-out; }
  @keyframes fi { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div id="hud">
  <div id="vig"></div>
  <div id="overlaytex"></div>
  <div id="hurt"></div>
  <div id="crosshair"></div>
  <div id="debug"></div>
  <div id="toast"></div>
  <div id="chatlog"></div>
  <div id="itemname"></div>
  <div id="stats">
    <div id="armorbar"></div><div id="hearts"></div>
    <div id="air"></div><div id="food"></div>
  </div>
  <div id="xpbar"><i></i></div><div id="xplevel"></div>
  <div id="hotbar"></div>
  <div id="chatbar"><input id="chatinput" maxlength="200" autocomplete="off" spellcheck="false"></div>
  <div id="touch">
    <div id="stick"><i></i></div>
    <div class="tbtn" id="tjump" style="right:24px;bottom:190px;width:76px;height:76px;">⤒</div>
    <div class="tbtn" id="tsneak" style="right:112px;bottom:120px;width:66px;height:60px;font-size:14px;">SNEAK</div>
    <div class="tbtn" id="tinv" style="right:24px;bottom:110px;width:76px;height:60px;font-size:14px;">INV</div>
  </div>
</div>

<div id="tooltip"></div>
<div id="drag"></div>

<div id="loading">
  <div style="font-size:26px;letter-spacing:3px">BLOCKCRAFT</div>
  <div class="bar"><i id="loadbar"></i></div>
  <div class="t" id="loadtxt">building the world…</div>
</div>

<div class="screen" id="title">
  <div class="panel">
    <div id="titlelogo">BLOCKCRAFT</div>
    <div id="titlesub">an infinite voxel sandbox — single HTML file, no dependencies</div>
    <div class="field"><label>World seed</label><input id="seedin" placeholder="leave blank for random"></div>
    <div class="field"><label>Game mode</label>
      <select id="modein"><option value="survival">Survival</option><option value="creative">Creative</option></select>
    </div>
    <div class="field"><label>Render distance</label>
      <select id="distin">
        <option value="4">4 — tiny</option><option value="6">6 — short</option>
        <option value="8" selected>8 — normal</option><option value="12">12 — far</option>
        <option value="16">16 — extreme</option>
      </select>
    </div>
    <button class="btn" id="btnplay">Create New World</button>
    <button class="btn" id="btnload">Load Saved World</button>
    <div class="help" id="helptext"></div>
  </div>
</div>

<div class="screen" id="pause">
  <div class="panel" style="width:min(380px,90vw)">
    <h2>Game Menu</h2>
    <button class="btn" id="btnresume">Back to Game</button>
    <div class="row"><button class="btn" id="btnsave">Save</button><button class="btn" id="btnmode">Toggle Mode</button></div>
    <button class="btn" id="btnquit">Save and Quit to Title</button>
    <div class="help" id="pausehelp"></div>
  </div>
</div>

<div class="screen" id="dead">
  <div class="panel" style="width:min(360px,90vw);text-align:center">
    <h2 style="font-size:22px;color:#a00">You Died!</h2>
    <div id="deathmsg" style="margin:10px 0;font-size:12px"></div>
    <button class="btn" id="btnrespawn">Respawn</button>
    <button class="btn" id="btntitle">Title Screen</button>
  </div>
</div>

<div class="screen" id="inv">
  <div class="panel" id="invpanel"></div>
</div>

<script id="shared-src" type="text/x-worker">
